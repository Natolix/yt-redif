name: Relay Stream
on:
  workflow_dispatch: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Stream videos in sequence
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set -x
          URLS=(
            "https://www.youtube.com/watch?v=Ber6THKTR-A"
            "https://www.youtube.com/watch?v=3U1x09j4yGY"
            "https://www.youtube.com/watch?v=Bml-VSsDxzc"
          )

          for SOURCE_URL in "${URLS[@]}"; do
            echo "=== Streaming : $SOURCE_URL ==="
            STREAM_URL=$(yt-dlp -g -f best "$SOURCE_URL" 2>&1 || true)
            ffmpeg -re -i "$STREAM_URL" -c copy -f flv "$RTMP_URL"
            echo "Vidéo terminée, passage à la suivante."
          done
          exit 0
