name: Relay Stream
on:
  workflow_dispatch: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Stream videos in sequence
        env:
          RTMP_URL: ${{ secrets.RTMP_URL }}
        run: |
          set -x
          URLS=(
            "https://github.com/Natolix/yt-redif/releases/download/v1/RDC26.Opening.Keynote.4vxV5T8xTJw.webm"
            "https://github.com/Natolix/yt-redif/releases/download/v1/RDC26.Creator.Keynote.mkv"
            "https://github.com/Natolix/yt-redif/releases/download/v1/Roblox.Innovation.Awards.coupee.mkv"
          )

          for VIDEO_URL in "${URLS[@]}"; do
            echo "=== Streaming : $VIDEO_URL ==="
            ffmpeg -re -i "$VIDEO_URL" -c copy -f flv "$RTMP_URL"
            echo "Vidéo terminée, passage à la suivante."
          done
          exit 0
